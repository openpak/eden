# The desktop Linux build of a release: an x86_64 AppImage (and the same tree as a tar.zst),
# attached to the vX.Y.Z release that release.yml creates for the same tag.
# It is built the way Citron's Linux nightly is: the pkgforge Arch container on a GitHub-hosted
# runner, installed to /usr, then bundled with quick-sharun and uruntime2appimage.
# Nothing passes through artifacts: the organisation's artifact quota filled up and stopped
# releases (2026-09-23), so the build attaches its files to the release itself.
name: Build Eden (Linux)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach to (empty: the latest vX.Y.Z release)'
        required: false
        default: ''

concurrency:
  group: eden-linux-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve the release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag=$INPUT_TAG
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=$(gh release list --repo "$REPO" --limit 100 --exclude-drafts --json tagName,createdAt \
              -q '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+"))] | sort_by(.createdAt) | last | .tagName // ""')
          fi
          if [ -z "$tag" ]; then
            echo "::error::No vX.Y.Z release found; pass the tag input."
            exit 1
          fi
          if ! gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag does not exist in $REPO."
            exit 1
          fi
          echo "Building and attaching to $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  appimage:
    name: x86_64 AppImage
    needs: [resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # The host's / is mounted at /host only so the step below can free disk space on it.
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      options: -v /:/host
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      # A hosted runner has about 14 GB free; the preinstalled toolchains this build does not use
      # are removed from the host (mounted at /host) to make room for the build tree.
      - name: Free disk space on the runner
        run: |
          df -h /host /
          rm -rf /host/usr/share/dotnet /host/usr/local/lib/android /host/opt/ghc \
            /host/usr/local/.ghcup /host/opt/hostedtoolcache/CodeQL /host/usr/share/swift \
            /host/usr/local/share/powershell /host/usr/local/share/chromium /host/usr/lib/jvm
          df -h /host /

      # Eden's Arch dependency list (docs/Deps.md), plus what the AppImage tooling deploys from
      # the system: Mesa and Vulkan drivers, the Wayland/X11 Qt platform bits, PipeWire/Pulse.
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel boost catch2 cmake enet ffmpeg fmt git glslang libzip lz4 ninja \
            nlohmann-json openssl opus qt6-base qt6-multimedia qt6-charts qt6-wayland qt6-svg \
            sdl3 zlib zstd zip unzip vulkan-headers vulkan-utility-libraries libusb \
            spirv-tools spirv-headers \
            libdecor libxkbcommon-x11 xcb-util-cursor xcb-util-image xcb-util-renderutil \
            xcb-util-wm mesa vulkan-mesa-layers pipewire pulseaudio pulseaudio-alsa \
            patchelf wget xorg-server-xvfb zsync

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          # openpak-client is a submodule; without it CMake has no OpenPak to build.
          # openpak-client is private: GITHUB_TOKEN reads only this repo.
          token: ${{ secrets.OPENPAK_MODULE_TOKEN || github.token }}
          submodules: true

      - name: Add Git Safe Directory
        run: git config --global --add safe.directory "$PWD"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_QT=ON \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_TESTS=OFF \
            -DENABLE_WERROR=OFF \
            -DYUZU_ROOM_STANDALONE=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Install to /usr
        run: cmake --install build

      - name: Package AppImage and tarball
        run: |
          set -eux
          SHARUN=https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/quick-sharun.sh
          URUNTIME=https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/uruntime2appimage.sh
          wget --retry-connrefused --tries=30 "$SHARUN" -O ./quick-sharun
          wget --retry-connrefused --tries=30 "$URUNTIME" -O ./uruntime2appimage
          chmod +x ./quick-sharun ./uruntime2appimage

          export DESKTOP=/usr/share/applications/dev.eden_emu.eden.desktop
          export ICON=/usr/share/icons/hicolor/scalable/apps/dev.eden_emu.eden.svg
          export DEPLOY_OPENGL=1 DEPLOY_VULKAN=1 DEPLOY_PIPEWIRE=1
          ./quick-sharun /usr/bin/eden*
          echo 'SHARUN_ALLOW_SYS_VK_ICD=1' > ./AppDir/.env

          name="eden-openpak-${TAG#openpak-}-linux-x86_64"
          mkdir -p dist
          (cd AppDir && tar -c --zstd -f "../dist/${name}.tar.zst" .)

          export VERSION="$TAG" OUTPATH="$PWD/dist" OUTNAME="${name}.AppImage"
          export UPINFO="gh-releases-zsync|${GITHUB_REPOSITORY%/*}|${GITHUB_REPOSITORY#*/}|latest|eden-openpak-*-linux-x86_64.AppImage.zsync"
          ./uruntime2appimage
          ls -l dist

      - name: Attach to the release
        # The build container has no gh; github-script needs nothing.
        uses: actions/github-script@v7
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/attach-to-release.js`)({ github, context, glob, core }, 'dist/*.AppImage\ndist/*.AppImage.zsync\ndist/*.tar.zst', process.env.TAG);
