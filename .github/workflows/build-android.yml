name: Build Eden (Android)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  android:
    name: arm64 APK
    runs-on: [self-hosted, linux, podman, heavy]
    # The runner is the owner's workstation: at most 8 CPUs for the build (2026-09-23).
    container:
      image: ubuntu:24.04
      options: --cpus 8
    # Repo default is read-only, and the release step needs to write.
    permissions:
      contents: write
    steps:
      - name: Bootstrap build container
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates wget unzip glslang-tools >/dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # openpak-client is a submodule; without it CMake has no OpenPak to build.
          # openpak-client is private: GITHUB_TOKEN reads only this repo.
          token: ${{ secrets.OPENPAK_MODULE_TOKEN || github.token }}
          submodules: true
      - name: Scratch in the runner's temp, not the machine's shared /tmp
        # /tmp is a RAM disk every build on the machine shares; when it filled on
        # 2026-09-24 a compiler died and a job hung for hours instead of failing.
        run: |
          mkdir -p "$RUNNER_TEMP/scratch"
          echo "TMPDIR=$RUNNER_TEMP/scratch" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        run: |
          # The self-hosted runner keeps its temp directory between runs: a previous run's tools are
          # reused, and a half-finished install is started over rather than moved onto.
          if [ ! -x "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            rm -rf "$RUNNER_TEMP/android-sdk/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools"
            unzip -q commandlinetools-linux-11076708_latest.zip -d "$RUNNER_TEMP/android-sdk/cmdline-tools"
            mv "$RUNNER_TEMP/android-sdk/cmdline-tools/cmdline-tools" "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          yes | "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Build
        run: NUM_JOBS=8 nice -n 10 ./.ci/android/build.sh -t standard -b Release

      # A tag publishes the APK as a release below; the artifact is for branch builds only, and a
      # full artifact quota must never stop a release (2026-09-23: it did).
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        with:
          name: eden-openpak-android
          path: artifacts/*

      # release.yml creates the tag's release; this attaches the APK once it exists.
      - name: Attach to the tag's release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/attach-to-release.js`)({ github, context, glob, core }, 'artifacts/*');

      # The runner runs this container as root in rootful Docker: what the build left behind is
      # handed back to the runner's own user, or the next checkout on this runner cannot clean it.
      - name: Hand the workspace back to the runner
        if: always()
        run: chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE"
      - name: Clear scratch
        if: always()
        run: rm -rf "$RUNNER_TEMP/scratch"
