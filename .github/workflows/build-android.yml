name: Build Eden (Android)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  android:
    name: arm64 APK
    runs-on: ubuntu-24.04
    # The host's / is mounted at /host only so the step below can free disk space on it.
    container:
      image: ubuntu:24.04
      options: -v /:/host
    # Repo default is read-only, and the release step needs to write.
    permissions:
      contents: write
    steps:
      # A hosted runner has about 14 GB free; the preinstalled toolchains this build does not use
      # are removed from the host (mounted at /host) to make room for the build tree.
      - name: Free disk space on the runner
        run: |
          df -h /host /
          rm -rf /host/usr/share/dotnet /host/usr/local/lib/android /host/opt/ghc \
            /host/usr/local/.ghcup /host/opt/hostedtoolcache/CodeQL /host/usr/share/swift \
            /host/usr/local/share/powershell /host/usr/local/share/chromium /host/usr/lib/jvm
          df -h /host /

      - name: Bootstrap build container
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates wget unzip glslang-tools >/dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # openpak-client is a submodule; without it CMake has no OpenPak to build.
          # openpak-client is private: GITHUB_TOKEN reads only this repo.
          token: ${{ secrets.OPENPAK_MODULE_TOKEN || github.token }}
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O "$RUNNER_TEMP/cmdline-tools.zip"
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-sdk/cmdline-tools"
          mv "$RUNNER_TEMP/android-sdk/cmdline-tools/cmdline-tools" "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          yes | "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Build
        # build.sh runs as many jobs as nproc reports: the hosted runner's 4 CPUs.
        run: ./.ci/android/build.sh -t standard -b Release

      # A tag publishes the APK as a release below; the artifact is for branch builds only, and a
      # full artifact quota must never stop a release (2026-09-23: it did).
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        with:
          name: eden-openpak-android
          path: artifacts/*

      # release.yml creates the tag's release; this attaches the APK once it exists.
      - name: Attach to the tag's release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/attach-to-release.js`)({ github, context, glob, core }, 'artifacts/*');
