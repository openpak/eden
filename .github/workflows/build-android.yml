name: Build Eden (Android)

on:
  push:
    branches: [main]
    tags: ['openpak-v*']
  workflow_dispatch:

jobs:
  android:
    name: arm64 APK
    runs-on: ubuntu-latest
    # Repo default is read-only, and the release step needs to write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned in src/android/app/build.gradle.kts; runners don't ship it.
      - name: Install NDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \"ndk;28.2.13676358\""

      # Host-side shader compiler the video_core build shells out to.
      - name: Install glslang
        run: sudo apt-get update -qq && sudo apt-get install -y glslang-tools

      - name: Build
        run: ./.ci/android/build.sh -t standard -b Release

      - uses: actions/upload-artifact@v4
        with:
          name: eden-openpak-android
          path: artifacts/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/openpak-v')
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
