name: Build Eden (Android)

on:
  push:
    branches: [main]
    tags: ['openpak-v*']
    # A CI or docs tweak doesn't need a 50-minute arm64 rebuild.
    paths-ignore: ['.github/**', 'README.md']
  workflow_dispatch:

jobs:
  android:
    name: arm64 APK
    runs-on: [self-hosted, linux, podman]
    container: ubuntu:24.04
    # Repo default is read-only, and the release step needs to write.
    permissions:
      contents: write
    steps:
      - name: Bootstrap build container
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates wget unzip glslang-tools >/dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # openpak-client is a submodule; without it CMake has no OpenPak to build.
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools"
          unzip -q commandlinetools-linux-11076708_latest.zip -d "$RUNNER_TEMP/android-sdk/cmdline-tools"
          mv "$RUNNER_TEMP/android-sdk/cmdline-tools/cmdline-tools" "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          yes | "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Build
        run: ./.ci/android/build.sh -t standard -b Release

      # A tag publishes the APK as a release below; the artifact is for branch builds only, and a
      # full artifact quota must never stop a release (2026-09-23: it did).
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        with:
          name: eden-openpak-android
          path: artifacts/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/openpak-v')
        # The self-hosted job runs in a container without the gh CLI; the action needs nothing.
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
